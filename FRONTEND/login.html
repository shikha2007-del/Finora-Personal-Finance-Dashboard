<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finora | Login</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="min-h-screen flex items-center justify-center">
        <div class="w-full max-w-md p-8 shadow-lg rounded-lg">
            <h1 class="text-3xl font-bold text-center">Welcome to Finora</h1>
            <p class="text-center mt-2">Login to manage your finances</p>

            <form id="loginForm" class="mt-6">
                <label>Email</label>
                <input type="email" id="email" required class="w-full border p-3 rounded mb-4">
                <label>Password</label>
                <input type="password" id="password" required class="w-full border p-3 rounded mb-4">
                <button type="submit" class="w-full bg-orange-500 text-white p-3 rounded">Login</button>
            </form>
            <p class="text-center mt-4">Don't have a account?
                <a href="register.html" class="text-orange-500">Register</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
